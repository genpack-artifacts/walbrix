set LINUX_ARGS="systemd.firstboot=0 panic=30"
if [ "$grub_cpu" = "i386" -o "$grub_cpu" = "x86_64" ]; then
    set LINUX_ARGS="$LINUX_ARGS console=ttyS0,115200n8r console=tty0"
fi

if [ -z "$timeout" ]; then
  set timeout=3
fi

if [ -z "$default" ]; then
  set default=normal
fi

set TITLE="Walbrix __VERSION__"

menuentry "$TITLE" --id normal {
  echo 'Loading kernel...'
  linux /boot/kernel root=systemimg:$BOOT_PARTITION_UUID $LINUX_ARGS video=1024x768
  echo 'Loading initramfs...'
  initrd /boot/initramfs
}

menuentry "$TITLE (text mode)" --id text {
  echo 'Loading kernel...'
  linux /boot/kernel root=systemimg:$BOOT_PARTITION_UUID $LINUX_ARGS systemd.unit=multi-user.target
  echo 'Loading initramfs...'
  initrd /boot/initramfs
}

menuentry "Transient(rescue) mode" --id transient {
  echo 'Loading kernel...'
  linux /boot/kernel root=systemimg:$BOOT_PARTITION_UUID $LINUX_ARGS systemd.unit=multi-user.target genpack.transient=1
  echo 'Loading initramfs...'
  initrd /boot/initramfs
}

if [ "${grub_platform}" = "efi" -a -f "($BOOT_PARTITION)/EFI/BOOT/memtest86.efi" ]; then
  menuentry 'MemTest86 (EFI)' {
    set root=$BOOT_PARTITION
    chainloader /EFI/BOOT/memtest86.efi
  }
fi

if [ "${grub_platform}" = "pc" ]; then
	menuentry 'memtest86+' {
		linux16 /boot/memtest86plus/memtest
	}
fi
